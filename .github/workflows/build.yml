name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Create Android project from index.html
        run: |
          set -e
          P=android-build
          rm -rf $P
          for d in app/src/main/assets app/src/main/java/com/dubbing/highlighter app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26; do mkdir -p $P/$d; done
          cp index.html $P/app/src/main/assets/index.html

          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DubbingHighlighter"
          include ":app"
          EOF
          cat > $P/build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.2.2" apply false }
          EOF
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n" > $P/gradle.properties
          cat > $P/app/build.gradle <<'EOF'
          plugins { id "com.android.application" }
          android {
              namespace "com.dubbing.highlighter"
              compileSdk 34
              defaultConfig {
                  applicationId "com.dubbing.highlighter"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="The Dubbing Highlighter"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                          <data android:mimeType="application/msword" />
                          <data android:mimeType="application/pdf" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#1d4ed8</item>
                  <item name="android:navigationBarColor">#1d4ed8</item>
              </style>
              <color name="ic_bg">#1D4ED8</color>
          </resources>
          EOF
          cat > $P/app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFE066" android:pathData="M30,40h48v12h-48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M30,58h48v5h-48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M30,68h30v5h-30z"/>
          </vector>
          EOF
          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > $P/app/src/main/java/com/dubbing/highlighter/MainActivity.java <<'EOF'
          package com.dubbing.highlighter;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> fileCb;
              private static final int REQ_FILE = 1;
              private volatile boolean pageReady = false;
              private volatile String pName, pMime, pB64;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  web.addJavascriptInterface(new Saver(), "AndroidSaver");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme()) || "blob".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          pageReady = true;
                          deliverPending();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{
                              "application/pdf", "text/plain", "application/json", "application/msword",
                              "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                              "application/octet-stream"});
                          try { startActivityForResult(Intent.createChooser(i, "เลือกไฟล์"), REQ_FILE); }
                          catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });

                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      String name = URLUtil.guessFileName(url, cd, mime);
                      if (url.startsWith("blob:")) {
                          String js = "(async()=>{try{const r=await fetch(\"" + url + "\");const bl=await r.blob();"
                              + "const fr=new FileReader();fr.onloadend=()=>AndroidSaver.save(fr.result.split(\",\")[1],"
                              + "\"" + name.replace("\"", "") + "\",\"" + (mime == null ? "application/octet-stream" : mime) + "\");"
                              + "fr.readAsDataURL(bl);}catch(e){AndroidSaver.fail(String(e));}})();";
                          web.evaluateJavascript(js, null);
                      }
                  });

                  handleIntent(getIntent());
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
                  if (pageReady) deliverPending();
              }

              // รับไฟล์ที่ถูกเปิดจาก Google Drive / ตัวจัดการไฟล์ ("เปิดด้วย" หรือ "แชร์")
              private void handleIntent(Intent i) {
                  if (i == null) return;
                  String a = i.getAction();
                  Uri u = null;
                  if (Intent.ACTION_VIEW.equals(a)) u = i.getData();
                  else if (Intent.ACTION_SEND.equals(a)) u = (Uri) i.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (u == null) return;
                  try {
                      String name = null;
                      try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                          if (c != null && c.moveToFirst()) {
                              int ix = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              if (ix >= 0) name = c.getString(ix);
                          }
                      } catch (Exception ignored) {}
                      String mime = getContentResolver().getType(u);
                      if (name == null || name.isEmpty()) {
                          String p = u.getLastPathSegment();
                          name = (p == null || p.isEmpty()) ? "document" : p;
                      }
                      String low = name.toLowerCase();
                      if (!(low.endsWith(".docx") || low.endsWith(".doc") || low.endsWith(".pdf") || low.endsWith(".txt"))) {
                          if (mime != null && mime.contains("wordprocessingml")) name += ".docx";
                          else if ("application/msword".equals(mime)) name += ".doc";
                          else if ("application/pdf".equals(mime)) name += ".pdf";
                          else name += ".txt";
                      }
                      InputStream is = getContentResolver().openInputStream(u);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                      is.close();
                      pMime = (mime == null) ? "application/octet-stream" : mime;
                      pB64 = Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
                      pName = name;
                  } catch (Exception e) {
                      Toast.makeText(this, "เปิดไฟล์ไม่สำเร็จ: " + e, Toast.LENGTH_LONG).show();
                  }
              }

              // ส่งไฟล์เข้าหน้าเว็บ โดยเรียก importFile() ของแอปให้เปิดเป็นแท็บบทใหม่
              private void deliverPending() {
                  if (pName == null) return;
                  String js = "(function(){var t=0;function go(){"
                      + "if(typeof importFile!=='function'){if(t++<50)setTimeout(go,200);return;}"
                      + "try{var n=AndroidSaver.pendingName();if(!n)return;var m=AndroidSaver.pendingMime();"
                      + "var bin=atob(AndroidSaver.pendingData());var u=new Uint8Array(bin.length);"
                      + "for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);"
                      + "AndroidSaver.clearPending();importFile(new File([u],n,{type:m}));}catch(e){}}"
                      + "setTimeout(go,600);})();";
                  web.evaluateJavascript(js, null);
              }

              class Saver {
                  @JavascriptInterface
                  public String pendingName() { return pName; }
                  @JavascriptInterface
                  public String pendingMime() { return pMime; }
                  @JavascriptInterface
                  public String pendingData() { return pB64; }
                  @JavascriptInterface
                  public void clearPending() { pName = null; pMime = null; pB64 = null; }

                  @JavascriptInterface
                  public void save(String b64, String name, String mime) {
                      try {
                          byte[] data = Base64.decode(b64, Base64.DEFAULT);
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          cv.put(MediaStore.Downloads.MIME_TYPE, mime);
                          cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(data); }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "บันทึกแล้วที่ Downloads/" + name, Toast.LENGTH_LONG).show());
                      } catch (Exception e) { fail(String.valueOf(e)); }
                  }
                  @JavascriptInterface
                  public void fail(String m) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "บันทึกไฟล์ไม่สำเร็จ: " + m, Toast.LENGTH_LONG).show());
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCb != null) {
                      Uri[] r = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              r = new Uri[n];
                              for (int i = 0; i < n; i++) r[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) r = new Uri[]{data.getData()};
                      }
                      fileCb.onReceiveValue(r);
                      fileCb = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          cat > make_icon.sh <<'EOF'
          set -e
          P=android-build
          R=$P/app/src/main/res
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          mkdir -p icon-tmp
          for spec in mdpi:108:76 hdpi:162:113 xhdpi:216:151 xxhdpi:324:227 xxxhdpi:432:302; do
            d=${spec%%:*}; r=${spec#*:}; full=${r%%:*}; art=${r##*:}
            convert icon.png -resize ${art}x${art} -background none -gravity center -extent ${full}x${full} PNG32:icon-tmp/ic_fg_$d.png
          done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $R/mipmap-$d
            cp icon-tmp/ic_fg_$d.png $R/mipmap-$d/ic_fg.png
          done
          rm -f $R/drawable/ic_fg.xml
          sed -i 's|@drawable/ic_fg|@mipmap/ic_fg|' $R/mipmap-anydpi-v26/ic_launcher.xml
          sed -i 's|#1D4ED8|#060402|' $R/values/styles.xml
          EOF
          if [ -f icon.png ]; then
            bash make_icon.sh || echo "สร้างไอคอนจาก icon.png ไม่สำเร็จ ใช้ไอคอนเริ่มต้นแทน"
          fi
      - name: Build APK
        working-directory: android-build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DubbingHighlighter-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
